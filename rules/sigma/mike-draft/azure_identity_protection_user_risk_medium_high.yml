title: Entra ID Protection Medium Or High Risk Detection
id: a693d411-8672-4dc7-8d15-4b7aa61bcad3
name: azure_identity_protection_user_risk_medium_high
status: experimental
description: |
    Detects a Microsoft Entra ID Protection risk detection rated medium or high for a user.
    This rule is a building block for the correlation rule "Entra ID Authentication Method Change After Risk Detection" and is not meant to alert on its own.
references:
    - https://learn.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
    - https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
author: Mike Sosa
date: 2026-11-04
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.004
logsource:
    product: azure
    service: riskdetection
detection:
    selection:
        riskLevel:
            - 'medium'
            - 'high'
    condition: selection
falsepositives:
    - Benign risk detections, such as a user signing in through a new VPN or from a new location while traveling
level: low
