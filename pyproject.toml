[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detection-test-harness"
version = "0.1.0"
description = "Replay synthetic Entra ID and Microsoft 365 telemetry against KQL and Sigma rules, offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb-kql[duckdb]==1.1.3",
    "pySigma==1.5.1",
    "pySigma-backend-kusto==1.0.1",
    "pySigma-backend-sqlite==2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
dth = "dth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
